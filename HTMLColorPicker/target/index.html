<!doctype html>
<html lang="nl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Tool Suite</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; margin: 2rem; line-height: 1.4; }
    .grid { display: grid; gap: 1rem; max-width: 720px; }
    a.card { display: block; padding: 1rem; border: 1px solid #ddd; border-radius: 12px; text-decoration: none; color: inherit; }
    a.card:hover { border-color: #aaa; }
    .muted { color: #666; font-size: 0.95rem; }
  </style>
</head>
<body>
  <h1>Tool Suite</h1>
  <p class="muted">Kies een tool:</p>
  <div class="grid">
    <a class="card" href="/DNSMegaTool/">
      <strong>DNSMegaTool</strong><br/>
      <span class="muted">DNS/WHOIS checks & exports</span>
    </a>
    <a class="card" href="/PortCheckerTool/">
      <strong>PortCheckerTool</strong><br/>
      <span class="muted">Port connectivity check</span>
    </a>
  </div>
</body>
</html>
