<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Quick and easy tool to gather public IPv4 and IPv6 information.">
  <title>IP Lookup Tool - justinverstijnen.nl</title>
  <link rel="stylesheet" href="assets/style.css">
  <link rel="icon" type="image/svg+xml" href="https://sajvwebsiteblobstorage.blob.core.windows.net/blog/tools-2375/logo.svg">
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <script src="https://cloud.umami.is/script.js" data-website-id="3ce7d7a4-539b-4d3c-981e-e96189fa5ac8" defer></script>
  <script src="assets/shared.js" defer></script>
  <script src="assets/app.js" defer></script>
</head>
<body>
  <div class="container">
    <div class="logo">
      <a href="https://justinverstijnen.nl" target="_blank" rel="noopener noreferrer">
        <img src="https://sajvwebsiteblobstorage.blob.core.windows.net/blog/tools-2375/logo.svg" width="50" height="50" alt="Logo">
      </a>
    </div>
    <h1>IP Lookup Tool</h1>
    <p class="subtitle">Quick and easy tool to gather public IPv4 and IPv6 information.</p>
    <div id="myIpShown" style="font-size:22px;font-weight:600;margin-bottom:10px;" aria-live="polite"></div>
    <div class="form-group">
      <input type="text" id="ipInput" placeholder="Enter IP address" aria-label="IPv4 or IPv6 address" autocomplete="off" spellcheck="false" maxlength="45">
      <button id="lookupBtn" type="button"><i class="ph ph-magnifying-glass" aria-hidden="true"></i> Lookup</button>
      <button id="useMyIpBtn" class="orange-btn" type="button"><i class="ph ph-crosshair" aria-hidden="true"></i> Use my IP</button>
      <button id="exportBtn" type="button"><i class="ph ph-download" aria-hidden="true"></i> Export</button>
    </div>
    <div id="result" class="result" aria-live="polite"></div>
    <div class="footer">
      <a href="https://github.com/JustinVerstijnen/IPLookupTool" target="_blank" rel="noopener noreferrer">
        &copy; <span id="copyright-year"></span> IP Lookup Tool by Justin Verstijnen
      </a>
    </div>
  </div>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4082816808518335" crossorigin="anonymous"></script>
  <ins class="adsbygoogle" style="display:block; text-align:center;" data-ad-layout="in-article" data-ad-format="fluid" data-ad-client="ca-pub-4082816808518335" data-ad-slot="9865066433"></ins>
  <script>(window.adsbygoogle = window.adsbygoogle || []).push({});</script>
</body>
</html>
