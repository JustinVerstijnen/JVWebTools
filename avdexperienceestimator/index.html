<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Estimate Azure Virtual Desktop region latency and compare HTTPS round-trip times from your browser.">
  <title>AVD Experience Estimator - justinverstijnen.nl</title>
  <link rel="stylesheet" href="./assets/style.css">
  <link rel="stylesheet" href="./assets/avd.css">
  <link rel="icon" type="image/svg+xml" href="https://sajvwebsiteblobstorage.blob.core.windows.net/blog/tools-2375/logo.svg">
  <script defer src="https://cloud.umami.is/script.js" data-website-id="3ce7d7a4-539b-4d3c-981e-e96189fa5ac8"></script>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4082816808518335" crossorigin="anonymous"></script>
  <script type="module" src="./assets/app.js"></script>
</head>
<body>
  <main class="container">
    <div class="logo">
      <a href="https://justinverstijnen.nl" target="_blank" rel="noopener">
        <img src="https://sajvwebsiteblobstorage.blob.core.windows.net/blog/tools-2375/logo.svg" width="50" height="50" alt="Justin Verstijnen">
      </a>
    </div>

    <h1>AVD Experience Estimator</h1>
    <p class="subtitle">Compare your connection to Azure Virtual Desktop regions using browser-based HTTPS response times and estimate the experience.</p>

    <div class="form-group">
      <button id="start" type="button">↻ Start full lookup</button>
      <button id="exportBtn" type="button" disabled>↓ Export</button>
    </div>

    <p id="progress" role="status" aria-live="polite">Starting lookup of 5 regions…</p>
    <div class="loading">
      <progress id="bar" value="0" max="1" aria-label="Lookup progress"></progress>
      <span id="percent" aria-hidden="true">0%</span>
    </div>

    <div class="table-wrapper">
      <table>
        <thead>
          <tr>
            <th scope="col" id="regionHeader" aria-sort="none"><button class="sort-button" type="button" data-sort="region" aria-label="Sort Azure region alphabetically">Azure region <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
            <th scope="col" id="latencyHeader" aria-sort="none"><button class="sort-button" type="button" data-sort="latency" title="Estimated one-way latency: half of the measured HTTPS round-trip time. Not a direct one-way measurement.">Latency (est.) <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
            <th scope="col" id="rttHeader" aria-sort="none"><button class="sort-button" type="button" data-sort="rtt" title="Median browser HTTPS request/response timing; not ICMP ping or RDP RTT.">RTT (HTTPS) <span class="sort-indicator" aria-hidden="true">↕</span></button></th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <p class="measurement-note"></p>
    <div class="footer">
      <a href="https://github.com/JustinVerstijnen/AVDExperienceEstimator" target="_blank" rel="noopener">© <span id="year"></span> AVD Experience Estimator by Justin Verstijnen</a>
    </div>
  </main>
  <script src="app.js"></script>
<ins class="adsbygoogle"
     style="display:block; text-align:center;"
     data-ad-layout="in-article"
     data-ad-format="fluid"
     data-ad-client="ca-pub-4082816808518335"
     data-ad-slot="9865066433"></ins>
<script>
     (adsbygoogle = window.adsbygoogle || []).push({});
</script>
</body>
</html>
